version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# Job-Search AI — Docker Compose
# Starts: ChromaDB (vector store) + Ollama (local LLM) + Flask app
#
# Quick start:
#   cp .env.example .env          # edit SMTP creds if you want email
#   docker compose up --build -d
#   docker compose exec ollama ollama pull phi4-mini   # first run only
#   open http://localhost:5000
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Weaviate (Vector Database) ────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: jobsearch_weaviate
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - DISABLE_TELEMETRY=true
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama (local LLM server) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jobsearch_ollama
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA_PATH:-.}/ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    # GPU support (NVIDIA): uncomment the deploy block below and ensure
    # nvidia-container-toolkit is installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    #
    # CPU-only mode works out of the box (no changes needed).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ── Flask Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobsearch_app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data          # persist pipeline XLSX and uploads
    env_file:
      - .env
    environment:
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - ENABLE_SCHEDULER=true
    depends_on:
      weaviate:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  weaviate_data:
    driver: local
