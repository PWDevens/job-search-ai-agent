<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Job-Search AI Agent — systems architecture</title>
  <desc id="desc">Two parallel paths from candidate input: a discovery path (Adzuna to retrieval to job_matcher to ranked jobs) that prioritizes what to apply to, and a requirements path (O*NET and CareerOneStop to occupation grounding to resume_coach and career_strategist to skill gaps) that improves hire chances. An offline evaluation loop measures the outputs.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .title{font-size:21px;font-weight:700;fill:#14181f}
    .sub{font-size:13px;font-style:italic;fill:#5b6573}
    .bt{font-size:14px;font-weight:600;fill:#14181f}
    .bs{font-size:11px;fill:#56606e}
    .hdr{font-size:12.5px;font-weight:700;letter-spacing:.03em;fill:#fff}
    .warn{font-size:10px;font-weight:600;fill:#b4690e}
    .lg{font-size:11px;fill:#5b6573}
    .flow{stroke:#9aa4b2;stroke-width:2;fill:none}
    .cross{stroke:#c79a3a;stroke-width:2;fill:none;stroke-dasharray:1 0}
    .dash{stroke:#9aa4b2;stroke-width:1.6;fill:none;stroke-dasharray:4 4}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa4b2"/></marker>
    <marker id="ahc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c79a3a"/></marker>
  </defs>

  <text x="520" y="28" text-anchor="middle" class="title">Job-Search AI Agent — Systems Architecture</text>
  <text x="520" y="48" text-anchor="middle" class="sub">Adzuna finds jobs · O*NET says what they require</text>

  <rect x="400" y="66" width="240" height="42" rx="9" fill="#fbf6e9" stroke="#c79a3a" stroke-width="1.5"/>
  <text x="520" y="84" text-anchor="middle" class="bt">Candidate</text>
  <text x="520" y="100" text-anchor="middle" class="bs">resume + target role</text>

  <path class="flow" d="M470,100 C360,116 300,116 260,128" marker-end="url(#ah)"/>
  <path class="flow" d="M570,100 C680,116 740,116 780,128" marker-end="url(#ah)"/>

  <rect x="70" y="128" width="380" height="26" rx="6" fill="#3b6fb0"/>
  <text x="260" y="145.5" text-anchor="middle" class="hdr">PRIORITIZE — what to apply to</text>
  <rect x="590" y="128" width="380" height="26" rx="6" fill="#2f8f63"/>
  <text x="780" y="145.5" text-anchor="middle" class="hdr">IMPROVE — chances of getting hired</text>

  <g>
    <path class="flow" d="M260,154 L260,170" marker-end="url(#ah)"/>
    <rect x="70" y="170" width="380" height="56" rx="8" fill="#eaf1fb" stroke="#3b6fb0" stroke-width="1.4"/>
    <text x="260" y="192" text-anchor="middle" class="bt">Adzuna API — discovery</text>
    <text x="200" y="210" text-anchor="middle" class="bs">jobs · salary · geo</text>
    <text x="338" y="210" text-anchor="middle" class="warn">⚠ desc truncated 500c</text>

    <path class="flow" d="M260,226 L260,244" marker-end="url(#ah)"/>
    <rect x="70" y="244" width="380" height="56" rx="8" fill="#f1f3f6" stroke="#9aa4b2" stroke-width="1.4"/>
    <text x="260" y="266" text-anchor="middle" class="bt">Retrieval (local)</text>
    <text x="260" y="284" text-anchor="middle" class="bs">bge embeddings · ChromaDB · rerank</text>

    <path class="flow" d="M260,300 L260,318" marker-end="url(#ah)"/>
    <rect x="70" y="318" width="380" height="52" rx="8" fill="#eaf1fb" stroke="#3b6fb0" stroke-width="1.4"/>
    <text x="260" y="339" text-anchor="middle" class="bt">job_matcher · agent</text>
    <text x="260" y="356" text-anchor="middle" class="bs">rank postings to candidate</text>

    <path class="flow" d="M260,370 L260,388" marker-end="url(#ah)"/>
    <rect x="70" y="388" width="380" height="50" rx="8" fill="#fff" stroke="#3b6fb0" stroke-width="1.4"/>
    <text x="260" y="409" text-anchor="middle" class="bt">Ranked jobs</text>
    <text x="260" y="425" text-anchor="middle" class="bs">apply-priority list</text>
  </g>

  <g>
    <path class="flow" d="M780,154 L780,170" marker-end="url(#ah)"/>
    <rect x="590" y="170" width="380" height="56" rx="8" fill="#e7f4ee" stroke="#2f8f63" stroke-width="1.4"/>
    <text x="780" y="192" text-anchor="middle" class="bt">O*NET + CareerOneStop</text>
    <text x="780" y="210" text-anchor="middle" class="bs">authoritative requirements · certs/licenses</text>

    <path class="flow" d="M780,226 L780,244" marker-end="url(#ah)"/>
    <rect x="590" y="244" width="380" height="56" rx="8" fill="#f1f3f6" stroke="#9aa4b2" stroke-width="1.4"/>
    <text x="780" y="266" text-anchor="middle" class="bt">Occupation grounding</text>
    <text x="780" y="284" text-anchor="middle" class="bs">title→O*NET-SOC · real requirements</text>

    <path class="flow" d="M780,300 L780,318" marker-end="url(#ah)"/>
    <rect x="590" y="318" width="380" height="52" rx="8" fill="#e7f4ee" stroke="#2f8f63" stroke-width="1.4"/>
    <text x="780" y="338" text-anchor="middle" class="bt">resume_coach + career_strategist</text>
    <text x="780" y="356" text-anchor="middle" class="bs">gap-closing recs · skill-gap blind spots</text>

    <path class="flow" d="M780,370 L780,388" marker-end="url(#ah)"/>
    <rect x="590" y="388" width="380" height="50" rx="8" fill="#fff" stroke="#2f8f63" stroke-width="1.4"/>
    <text x="780" y="409" text-anchor="middle" class="bt">Resume fixes + skill/cert gaps</text>
    <text x="780" y="425" text-anchor="middle" class="bs">what to close to get hired</text>
  </g>

  <path class="cross" d="M450,344 L590,344" marker-end="url(#ahc)"/>
  <text x="520" y="337" text-anchor="middle" class="warn">jobs as context</text>

  <path class="dash" d="M260,438 L260,470" marker-end="url(#ah)"/>
  <path class="dash" d="M780,438 L780,470" marker-end="url(#ah)"/>
  <rect x="70" y="470" width="900" height="74" rx="9" fill="none" stroke="#9aa4b2" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="90" y="492" class="hdr" fill="#56606e">OFFLINE EVALUATION LOOP</text>
  <text x="90" y="516" class="bs">• corpora: O*NET-grounded synthetic (labeled) + Adzuna (realistic, noisy)</text>
  <text x="90" y="533" class="bs">• rubric_v2: gnd% (posting demand) + auth% (occupation-grounded) — JTBD-aligned</text>
  <text x="640" y="516" class="bs">• deterministic single-GPU pod</text>
  <text x="640" y="533" class="bs">• raw-output persistence → free re-scoring</text>

  <rect x="70" y="566" width="13" height="13" rx="3" fill="#eaf1fb" stroke="#3b6fb0"/>
  <text x="90" y="576" class="lg">discovery / prioritize</text>
  <rect x="245" y="566" width="13" height="13" rx="3" fill="#e7f4ee" stroke="#2f8f63"/>
  <text x="265" y="576" class="lg">requirements / hire-chances</text>
  <rect x="470" y="566" width="13" height="13" rx="3" fill="#f1f3f6" stroke="#9aa4b2"/>
  <text x="490" y="576" class="lg">infra / evaluation</text>
  <line x1="640" y1="572" x2="668" y2="572" class="cross" marker-end="url(#ahc)"/>
  <text x="675" y="576" class="lg">matched jobs feed agent context</text>
</svg>
